{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Registrar Pago</h3>

        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-info alert-dismissible fade show">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                            ></button>

                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}

            <form
                method="POST"
                action="{{ url_for('asesor.crear_pago') }}"
            >

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Crédito
                        </label>

                        <select
                            name="numero_radicado"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione un crédito
                            </option>

                            {% for credito in creditos %}

                                <option value="{{ credito[0] }}">

                                    {{ credito[0] }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Número de Cuota
                        </label>

                        <input
                            type="number"
                            name="numero_cuota"
                            class="form-control"
                            min="1"
                            required
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Fecha de Pago
                        </label>

                        <input
                            type="date"
                            name="fecha_pago"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Valor Pagado
                        </label>

                        <input
                            type="number"
                            name="valor_pagado"
                            class="form-control"
                            min="1"
                            step="0.01"
                            required
                        >

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Estado
                    </label>

                    <select
                        name="estado"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Seleccione
                        </option>

                        <option value="a tiempo">
                            A Tiempo
                        </option>

                        <option value="pagado con mora">
                            Pagado con Mora
                        </option>

                        <option value="pendiente">
                            Pendiente
                        </option>

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Registrar Pago
                    </button>

                    <a
                        href="{{ url_for('asesor.pagos') }}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
