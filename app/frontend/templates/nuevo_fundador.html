{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Registrar Fundador</h3>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-info alert-dismissible fade show">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                            </button>

                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}

            <form
                method="POST"
                action="{{ url_for('asesor.crear_fundador') }}"
            >

                <div class="mb-3">

                    <label class="form-label">
                        Asociado
                    </label>

                    <select
                        name="cedula"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Seleccione un asociado
                        </option>

                        {% for asociado in asociados %}

                            <option value="{{ asociado[0] }}">

                                {{ asociado[1] }}
                                {{ asociado[2] }}
                                ({{ asociado[0] }})

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Número de Acta
                    </label>

                    <input
                        type="text"
                        name="numero_acta"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Año de Reconocimiento
                    </label>

                    <input
                        type="number"
                        name="anio_reconocimiento"
                        class="form-control"
                        min="1900"
                        max="2100"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Beneficios
                    </label>

                    <textarea
                        name="beneficios"
                        class="form-control"
                        rows="4"
                        required
                    ></textarea>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Registrar Fundador
                    </button>

                    <a
                        href="{{ url_for('asesor.fundadores') }}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
