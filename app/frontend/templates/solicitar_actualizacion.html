<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Actualización</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <a href="{{ url_for('auth.dashboard_asociado') }}"
       class="btn btn-secondary btn-sm mb-3">

        Volver

    </a>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h2 class="mb-4">
                Solicitud de Actualización de Datos
            </h2>

            <p class="text-muted">
                Los cambios solicitados serán revisados por un asesor antes de ser aplicados.
            </p>

            <form method="POST"
                  action="{{ url_for('asociado.guardar_solicitud_actualizacion') }}">

                <div class="mb-3">
                    <label class="form-label">
                        Nuevo Teléfono
                    </label>

                    <input type="text"
                           name="telefono"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Nuevo Correo
                    </label>

                    <input type="email"
                           name="correo"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Nueva Dirección
                    </label>

                    <input type="text"
                           name="direccion"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Nuevo Municipio
                    </label>

                    <input type="text"
                           name="municipio"
                           class="form-control">
                </div>

                <button type="submit"
                        class="btn btn-primary">

                    Enviar Solicitud

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
