{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Editar Cuenta de Ahorro</h3>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info alert-dismissible fade show">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                            </button>

                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form
                method="POST"
                action="{{ url_for('asesor.actualizar_cuenta', numero_cuenta=cuenta[0]) }}"
            >

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Número de Cuenta
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            value="{{ cuenta[0] }}"
                            readonly
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Fecha de Apertura
                        </label>

                        <input
                            type="date"
                            name="fecha_apertura"
                            class="form-control"
                            value="{{ cuenta[1] }}"
                            required
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Estado
                        </label>

                        <select
                            name="estado"
                            class="form-select"
                            required
                        >

                            <option
                                value="activa"
                                {% if cuenta[2] == 'activa' %}selected{% endif %}
                            >
                                Activa
                            </option>

                            <option
                                value="inactiva"
                                {% if cuenta[2] == 'inactiva' %}selected{% endif %}
                            >
                                Inactiva
                            </option>

                            <option
                                value="embargada"
                                {% if cuenta[2] == 'embargada' %}selected{% endif %}
                            >
                                Embargada
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Asociado
                        </label>

                        <select
                            name="cedula_asociado"
                            class="form-select"
                            required
                        >

                            {% for asociado in asociados %}

                                <option
                                    value="{{ asociado[0] }}"
                                    {% if asociado[0] == cuenta[3] %}selected{% endif %}
                                >

                                    {{ asociado[1] }}
                                    {{ asociado[2] }}
                                    ({{ asociado[0] }})

                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Agencia
                    </label>

                    <select
                        name="codigo_agencia"
                        class="form-select"
                        required
                    >

                        {% for agencia in agencias %}

                            <option
                                value="{{ agencia[0] }}"
                                {% if agencia[0] == cuenta[4] %}selected{% endif %}
                            >

                                {{ agencia[1] }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Actualizar Cuenta
                    </button>

                    <a
                        href="{{ url_for('asesor.cuentas') }}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
