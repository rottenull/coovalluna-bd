{% extends "base.html" %}

{% block title %}
Editar Asociado
{% endblock %}

{% block content %}

<h3 class="mb-4">
    Editar Asociado
</h3>

<div class="card">
    <div class="card-body">

        <form method="POST" action="/asociados/actualizar/{{ asociado[0] }}">

            <div class="card mb-4">
                <div class="card-header">
                    <strong>Información Básica</strong>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Cédula</label>
                        <input type="text"
                               name="cedula"
                               class="form-control"
                               value="{{ asociado[0] }}"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre (*)</label>
                        <input type="text"
                               name="nombre"
                               class="form-control"
                               value="{{ asociado[1] }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido (*)</label>
                        <input type="text"
                               name="apellido"
                               class="form-control"
                               value="{{ asociado[2] }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date"
                               name="fecha_nacimiento"
                               class="form-control"
                               value="{{ asociado[8] if asociado[8] else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text"
                               name="direccion"
                               class="form-control"
                               value="{{ asociado[5] if asociado[5] else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Municipio</label>
                        <input type="text"
                               name="municipio"
                               class="form-control"
                               value="{{ asociado[6] if asociado[6] else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text"
                               name="telefono"
                               class="form-control"
                               value="{{ asociado[3] if asociado[3] else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email"
                               name="correo"
                               class="form-control"
                               value="{{ asociado[4] if asociado[4] else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de Afiliación</label>
                        <input type="date"
                               name="fecha_afiliacion"
                               class="form-control"
                               value="{{ asociado[7] if asociado[7] else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado (*)</label>
                        <select name="estado" class="form-select" required>
                            <option value="activo" {% if asociado[9] == 'activo' %}selected{% endif %}>
                                Activo
                            </option>
                            <option value="suspendido" {% if asociado[9] == 'suspendido' %}selected{% endif %}>
                                Suspendido
                            </option>
                            <option value="retirado" {% if asociado[9] == 'retirado' %}selected{% endif %}>
                                Retirado
                            </option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-secondary">
                    Guardar Cambios
                </button>

                <a href="/asociados" class="btn btn-light border">
                    Cancelar
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
