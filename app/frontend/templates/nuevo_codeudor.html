{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Registrar Codeudor</h3>

        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-info alert-dismissible fade show">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                            ></button>

                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}

            <form
                method="POST"
                action="{{ url_for('asesor.crear_codeudor') }}"
            >

                <div class="mb-3">

                    <label class="form-label">
                        Crédito
                    </label>

                    <select
                        name="numero_radicado"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Seleccione un crédito
                        </option>

                        {% for credito in creditos %}

                            <option value="{{ credito[0] }}">

                                {{ credito[0] }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Asociado que actuará como Codeudor
                    </label>

                    <select
                        name="cedula_codeudor"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Seleccione un asociado
                        </option>

                        {% for asociado in asociados %}

                            <option value="{{ asociado[0] }}">

                                {{ asociado[1] }}
                                {{ asociado[2] }}
                                ({{ asociado[0] }})

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Fecha de Firma
                    </label>

                    <input
                        type="date"
                        name="fecha_firma"
                        class="form-control"
                        required
                    >

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Registrar Codeudor
                    </button>

                    <a
                        href="{{ url_for('asesor.codeudores') }}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
