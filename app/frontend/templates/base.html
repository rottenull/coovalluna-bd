<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        COOVALLUNA
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">

</head>

<body>

<div class="container-fluid p-0">

    <!-- ENCABEZADO -->

    <div class="border-bottom bg-light">

        <div class="d-flex justify-content-between align-items-center p-3">

            <strong>
                COOVALLUNA
            </strong>

            <div>

                Usuario:
                {{ session.usuario if session.usuario else "Administrador del Sistema" }}

                <a href="/logout"
                   class="btn btn-outline-secondary btn-sm ms-3">

                    Cerrar sesión

                </a>

            </div>

        </div>

    </div>

    <!-- CONTENIDO -->

    <div class="row g-0">

        <!-- SIDEBAR -->

        <div class="col-md-2 border-end bg-light min-vh-100">

            <div class="p-3">

                <ul class="nav flex-column">

                    <li class="nav-item mb-2">
                        <a href="/agencias"
                           class="nav-link text-dark">
                            Agencias
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="/empleados"
                           class="nav-link text-dark">
                            Empleados
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="/asociados"
                           class="nav-link text-dark">
                            Asociados
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="/reportes"
                           class="nav-link text-dark">
                            Reportes
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="#"
                           class="nav-link text-dark">
                            Usuarios y Roles
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="/auditoria"
                           class="nav-link text-dark">
                            Auditoría
                        </a>
                    </li>

                </ul>

            </div>

        </div>

        <!-- CONTENIDO PRINCIPAL -->

        <div class="col-md-10">

            <div class="p-4">

                {% block content %}
                {% endblock %}

            </div>

        </div>

    </div>

    <!-- FOOTER -->

    <div class="border-top bg-light p-2 text-center small">

        Sistema de Gestión COOVALLUNA

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
