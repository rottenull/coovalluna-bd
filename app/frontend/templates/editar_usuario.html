{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Editar usuario</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin.actualizar_usuario', id_usuario=usuario[0]) }}">
        <div class="mb-3">
            <label class="form-label">ID</label>
            <input type="text" class="form-control" value="{{ usuario[0] }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" class="form-control" value="{{ usuario[1] }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select name="rol" class="form-select" required>
                <option value="admin" {% if usuario[2] == 'admin' %}selected{% endif %}>admin</option>
                <option value="asesor" {% if usuario[2] == 'asesor' %}selected{% endif %}>asesor</option>
                <option value="asociado" {% if usuario[2] == 'asociado' %}selected{% endif %}>asociado</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select name="estado" class="form-select" required>
                <option value="activo" {% if usuario[3] == 'activo' %}selected{% endif %}>activo</option>
                <option value="inactivo" {% if usuario[3] == 'inactivo' %}selected{% endif %}>inactivo</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Empleado (solo admin o asesor)</label>
            <select name="cedula_empleado" class="form-select">
                <option value="">Seleccione</option>
                {% for e in empleados %}
                <option value="{{ e[0] }}" {% if usuario[4] == e[0] %}selected{% endif %}>
                    {{ e[0] }} - {{ e[1] }} {{ e[2] }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Asociado (solo rol asociado)</label>
            <select name="cedula_asociado" class="form-select">
                <option value="">Seleccione</option>
                {% for a in asociados %}
                <option value="{{ a[0] }}" {% if usuario[5] == a[0] %}selected{% endif %}>
                    {{ a[0] }} - {{ a[1] }} {{ a[2] }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <a href="{{ url_for('admin.usuarios') }}" class="btn btn-secondary">Volver</a>
    </form>

    <hr class="my-4">

    <h4>Restablecer contraseña</h4>

    <form method="POST" action="{{ url_for('admin.restablecer_contrasena', id_usuario=usuario[0]) }}">
        <div class="mb-3">
            <label class="form-label">Nueva contraseña</label>
            <input type="text" name="nueva_contrasena" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-danger">
            Restablecer contraseña
        </button>
    </form>
</div>
{% endblock %}
