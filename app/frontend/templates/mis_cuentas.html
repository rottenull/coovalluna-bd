<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Cuentas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <a href="{{ url_for('auth.dashboard_asociado') }}" class="btn btn-secondary btn-sm mb-3">Volver</a>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-4">Mis Cuentas de Ahorro</h2>

            {% if cuentas %}
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Número Cuenta</th>
                        <th>Fecha Apertura</th>
                        <th>Estado</th>
                        <th>Agencia</th>
                        <th>Saldo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cuenta in cuentas %}
                    <tr>
                        <td>{{ cuenta[0] }}</td>
                        <td>{{ cuenta[1] }}</td>
                        <td>{{ cuenta[2] }}</td>
                        <td>{{ cuenta[3] }}</td>
                        <td>{{ cuenta[4] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <div class="alert alert-info">No tienes cuentas registradas.</div>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
