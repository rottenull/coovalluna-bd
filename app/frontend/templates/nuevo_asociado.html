{% extends "base.html" %}

{% block title %}
Nuevo Asociado
{% endblock %}

{% block content %}

<h3 class="mb-4">
    Registrar Nuevo Asociado
</h3>

<div class="card">
    <div class="card-body">

        <form method="POST" action="/asociados/crear">

            <div class="card mb-4">
                <div class="card-header">
                    <strong>Información Básica</strong>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Cédula (*)</label>
                        <input type="text"
                               name="cedula"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre (*)</label>
                        <input type="text"
                               name="nombre"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido (*)</label>
                        <input type="text"
                               name="apellido"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date"
                               name="fecha_nacimiento"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text"
                               name="direccion"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Municipio</label>
                        <input type="text"
                               name="municipio"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text"
                               name="telefono"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email"
                               name="correo"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de Afiliación</label>
                        <input type="date"
                               name="fecha_afiliacion"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado (*)</label>
                        <select name="estado" class="form-select" required>
                            <option value="activo">Activo</option>
                            <option value="suspendido">Suspendido</option>
                            <option value="retirado">Retirado</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-secondary">
                    Guardar Asociado
                </button>

                <button type="reset" class="btn btn-light border">
                    Limpiar Formulario
                </button>

                <a href="/asociados" class="btn btn-light border">
                    Cancelar
                </a>
            </div>

        </form>

    </div>
</div>

<div class="border mt-4 p-2 small">
    El asesor/cajero puede registrar los datos del asociado, pero debe respetar los valores de estado permitidos por el sistema.
</div>

{% endblock %}
