{% extends "base.html" %}

{% block title %}
Editar Empleado
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Editar Empleado</h3>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info alert-dismissible fade show">
                            {{ message }}
                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert">
                            </button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST"
                  action="{{ url_for('admin.actualizar_empleado', cedula=empleado[0]) }}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Cédula
                        </label>

                        <input type="text"
                               class="form-control"
                               value="{{ empleado[0] }}"
                               readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Estado
                        </label>

                        <select name="estado"
                                class="form-select"
                                required>

                            <option value="activo"
                                {% if empleado[6] == 'activo' %}selected{% endif %}>
                                Activo
                            </option>

                            <option value="inactivo"
                                {% if empleado[6] == 'inactivo' %}selected{% endif %}>
                                Inactivo
                            </option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input type="text"
                               name="nombre"
                               class="form-control"
                               value="{{ empleado[1] }}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Apellido
                        </label>

                        <input type="text"
                               name="apellido"
                               class="form-control"
                               value="{{ empleado[2] }}"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Correo
                        </label>

                        <input type="email"
                               name="correo"
                               class="form-control"
                               value="{{ empleado[5] }}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Fecha de Ingreso
                        </label>

                        <input type="date"
                               name="fecha_ingreso"
                               class="form-control"
                               value="{{ empleado[3] }}"
                               required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Salario
                    </label>

                    <input type="number"
                           step="0.01"
                           name="salario"
                           class="form-control"
                           value="{{ empleado[4] }}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Cargo
                    </label>

                    <select name="id_cargo"
                            class="form-select"
                            required>

                        {% for cargo in cargos %}

                        <option value="{{ cargo[0] }}"
                            {% if cargo[0] == empleado[8] %}selected{% endif %}>

                            {{ cargo[1] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Agencia de Adscripción
                    </label>

                    <select name="codigo_agencia"
                            class="form-select"
                            required>

                        {% for agencia in agencias %}

                        <option value="{{ agencia[0] }}"
                            {% if agencia[0] == empleado[7] %}selected{% endif %}>

                            {{ agencia[1] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Supervisor
                    </label>

                    <select name="supervisor_cedula"
                            class="form-select">

                        <option value="">
                            Sin supervisor
                        </option>

                        {% for supervisor in supervisores %}

                        <option value="{{ supervisor[0] }}"
                            {% if supervisor[0] == empleado[9] %}selected{% endif %}>

                            {{ supervisor[1] }} {{ supervisor[2] }}
                            ({{ supervisor[0] }})

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        Actualizar Empleado

                    </button>

                    <a href="{{ url_for('admin.empleados') }}"
                       class="btn btn-secondary">

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
