{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Registrar Nuevo Crédito</h3>

        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-info alert-dismissible fade show">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                            </button>

                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}

            <form
                method="POST"
                action="{{ url_for('asesor.crear_credito') }}"
            >

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Número de Radicado
                        </label>

                        <input
                            type="number"
                            name="numero_radicado"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Valor Solicitado
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="valor_solicitado"
                            class="form-control"
                            required
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Valor Aprobado
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="valor_aprobado"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Plazo (meses)
                        </label>

                        <input
                            type="number"
                            name="plazo"
                            class="form-control"
                            required
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Tasa de Interés (%)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="tasa_interes"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Fecha de Aprobación
                        </label>

                        <input
                            type="date"
                            name="fecha_aprobacion"
                            class="form-control"
                            required
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Primer Vencimiento
                        </label>

                        <input
                            type="date"
                            name="fecha_primer_vencimiento"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Línea de Crédito
                        </label>

                        <select
                            name="linea_credito"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione
                            </option>

                            <option value="libre inversión">
                                Libre Inversión
                            </option>

                            <option value="vivienda">
                                Vivienda
                            </option>

                            <option value="agropecuario">
                                Agropecuario
                            </option>

                            <option value="educativo">
                                Educativo
                            </option>

                            <option value="empresarial">
                                Empresarial
                            </option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Estado
                        </label>

                        <select
                            name="estado"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione
                            </option>

                            <option value="en estudio">
                                En Estudio
                            </option>

                            <option value="aprobado">
                                Aprobado
                            </option>

                            <option value="desembolsado">
                                Desembolsado
                            </option>

                            <option value="al día">
                                Al Día
                            </option>

                            <option value="en mora">
                                En Mora
                            </option>

                            <option value="cancelado">
                                Cancelado
                            </option>

                            <option value="castigado">
                                Castigado
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Asociado
                        </label>

                        <select
                            name="cedula_asociado"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione un asociado
                            </option>

                            {% for asociado in asociados %}

                            <option value="{{ asociado[0] }}">

                                {{ asociado[1] }}
                                {{ asociado[2] }}
                                ({{ asociado[0] }})

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Agencia
                    </label>

                    <select
                        name="codigo_agencia"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Seleccione una agencia
                        </option>

                        {% for agencia in agencias %}

                        <option value="{{ agencia[0] }}">

                            {{ agencia[1] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Registrar Crédito
                    </button>

                    <a
                        href="{{ url_for('asesor.creditos') }}"
                        class="btn btn-secondary"
                    >
                        Volver
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
