<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COOVALLUNA — Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
        }

        .panel-marca {
            background-color: #5f6773;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem 2.5rem;
            min-height: 100vh;
        }

        .panel-marca h2 {
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 1.2rem;
            letter-spacing: 1px;
            color: white;
        }

        .panel-marca p {
            font-size: 1.1rem;
            opacity: 0.88;
            line-height: 1.8;
        }

        .panel-formulario {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: #f4f5f7;
        }

        .tarjeta-login {
            background: white;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
        }

        .tarjeta-login h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>

<div class="container-fluid p-0" style="min-height:100vh; display:flex;">

    <div class="row g-0 w-100">

        <!-- PANEL IZQUIERDO -->
        <div class="col-md-5 panel-marca">

            <div>
                <h2>COOVALLUNA</h2>
                <p>
                    Sistema de Gestión de la Cooperativa de Ahorro y Crédito del Valle del Cauca.
                </p>
                <p>
                    Acceso restringido a personal autorizado.
                </p>
            </div>

        </div>

        <!-- PANEL DERECHO -->
        <div class="col-md-7 panel-formulario">

            <div class="tarjeta-login">

                <h1>Iniciar sesión</h1>

                <form method="post">

                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text"
                           id="usuario"
                           name="usuario"
                           class="form-control mb-3"
                           placeholder="Nombre de usuario"
                           required>

                    <label for="rol" class="form-label">Rol</label>
                    <select id="rol"
                            name="rol"
                            class="form-select mb-3"
                            required>
                        <option value="">Selecciona un rol</option>
                        <option value="admin">Administrador</option>
                        <option value="asesor">Asesor</option>
                        <option value="asociado">Asociado</option>
                    </select>

                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password"
                           id="contrasena"
                           name="contrasena"
                           class="form-control mb-4"
                           required>

                    <button type="submit"
                            id="btnEntrar"
                            class="btn btn-secondary w-100"
                            disabled>
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script>

const usuario = document.getElementById("usuario");
const rol = document.getElementById("rol");
const contrasena = document.getElementById("contrasena");
const boton = document.getElementById("btnEntrar");

function validarFormulario() {

    const usuarioValido =
        usuario.value.trim() !== "";

    const rolValido =
        rol.value !== "";

    const contrasenaValida =
        contrasena.value.trim() !== "";

    if (
        usuarioValido &&
        rolValido &&
        contrasenaValida
    ) {

        boton.disabled = false;

        boton.classList.remove("btn-secondary");
        boton.classList.add("btn-primary");

    } else {

        boton.disabled = true;

        boton.classList.remove("btn-primary");
        boton.classList.add("btn-secondary");

    }

}

usuario.addEventListener("input", validarFormulario);
rol.addEventListener("change", validarFormulario);
contrasena.addEventListener("input", validarFormulario);

</script>

</body>
</html>
