<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card p-4">

                <h1>iniciar sesión</h1>

                <form method="post">

                    <label for="usuario">usuario</label>

                    <input type="text"
                           id="usuario"
                           name="usuario"
                           class="form-control mb-3"
                           required>

                    <label for="rol">rol</label>

                    <select id="rol"
                            name="rol"
                            class="form-select mb-3"
                            required>

                        <option value="">
                            selecciona un rol
                        </option>

                        <option value="admin">
                            administrador
                        </option>

                        <option value="asesor">
                            asesor
                        </option>

                        <option value="asociado">
                            asociado
                        </option>

                    </select>

                    <label for="contrasena">contraseña</label>

                    <input type="password"
                           id="contrasena"
                           name="contrasena"
                           class="form-control mb-4"
                           required>

                    <button type="submit"
                            id="btnEntrar"
                            class="btn btn-secondary"
                            disabled>

                        entrar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script>

const usuario = document.getElementById("usuario");
const rol = document.getElementById("rol");
const contrasena = document.getElementById("contrasena");
const boton = document.getElementById("btnEntrar");

function validarFormulario() {

    const usuarioValido =
        usuario.value.trim() !== "";

    const rolValido =
        rol.value !== "";

    const contrasenaValida =
        contrasena.value.trim() !== "";

    if (
        usuarioValido &&
        rolValido &&
        contrasenaValida
    ) {

        boton.disabled = false;

        boton.classList.remove("btn-secondary");
        boton.classList.add("btn-primary");

    } else {

        boton.disabled = true;

        boton.classList.remove("btn-primary");
        boton.classList.add("btn-secondary");

    }

}

usuario.addEventListener("input", validarFormulario);
rol.addEventListener("change", validarFormulario);
contrasena.addEventListener("input", validarFormulario);

</script>

</body>
</html>
