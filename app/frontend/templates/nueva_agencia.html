{% extends "base.html" %}

{% block title %}
Nueva Agencia
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Registrar Nueva Agencia</h3>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST"
                  action="{{ url_for('admin.crear_agencia') }}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Código de Agencia
                        </label>

                        <input type="number"
                               name="codigo"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Nombre de la Agencia
                        </label>

                        <input type="text"
                               name="nombre"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Dirección
                    </label>

                    <input type="text"
                           name="direccion"
                           class="form-control"
                           required>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Municipio
                        </label>

                        <input type="text"
                               name="municipio"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Teléfono
                        </label>

                        <input type="text"
                               name="telefono"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Fecha de Apertura
                    </label>

                    <input type="date"
                           name="fecha_apertura"
                           class="form-control"
                           required>

                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        Guardar Agencia

                    </button>

                    <a href="{{ url_for('admin.agencias') }}"
                       class="btn btn-secondary">

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
